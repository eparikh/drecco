<html>
<head>
    <script src="js/jquery-2.2.4.min.js"></script>
    <script src="js/gameSettings.js"></script>
    <link href="css/bootstrap.css" rel="stylesheet">
    <style>
        #gameSettings {
            max-width: 960px;
            margin: auto;
            margin-top: 1rem;
        }
        .iframe-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-iframe {
            margin: 0;
            padding: 0;
            border: none;
            margin: auto;
        }
    </style>
</head>
<body>
    <form id="gameSettings" class="well"></form>
    <script>
        var modeChoices = ['PvP','PvAI','AIvP','AIvAI'];
        var planetChoices = ['Visible','Invisible'];
        newSelect('Planet Visibility',planetChoices,'planetSelect');
        newSelect('Game Mode',modeChoices,'modeSelect');
        newTextBox('AI Placement Seed (blank for random)','seed');
        newStartBtn(['planetSelect', 'modeSelect', 'seed']);
    </script>

    <div id="modeSelect" style="display: none"></div>
    <div id="planetSelect" style="display: none"></div>
    <div id="seed" style="display: none"></div>


    <div class="iframe-container">
    <iframe id="game-iframe" data-src="game.html" src="about:blank" width="838" height="638">
    </iframe></div>

</body>
</html>
