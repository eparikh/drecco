<html>
<head>
    <script src="js/jquery-2.2.4.min.js"></script>
    <script src="js/gameSettings.js"></script>
    <link href="css/bootstrap.css" rel="stylesheet">
    <style>
        #gameSettings {
            max-width: 960px;
            margin: auto;
            margin-top: 1rem;
        }
        .iframe-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-iframe {
            margin: 0;
            padding: 0;
            border: none;
            margin: auto;
        }
    </style>
</head>
<body>
    <form id="gameSettings" class="well"></form>

    <script type="text/javascript">
        var modeChoices = ['PvP'];
        newSelect('Game Mode',modeChoices,'modeSelect');
        newTextBox('AI Placement Seed (blank for random)','seed');
        newStartBtn(['modeSelect', 'seed']);
    </script>

    <div id="modeSelect" style="display: none"></div>
    <div id="seed" style="display: none"></div>

    <div class="iframe-container" style="width: 100vw; height: 100vh;">
    <iframe id="game-iframe" data-src="game.html" src="about:blank" width="100%" height="100%">
    </iframe></div>

</body>
</html>
