<!DOCTYPE html>
<html>
    <style type="text/css"> 
        #grid{
            height: 100%;
        }
        #stick{
            height: 100%;
        }
        .box ul{
            display: flex;
            margin: 0;
        }
        .box ul li{
            width: 30px;
            height: 30px;
            border: 1px solid #000;
            list-style-type:none;
            line-height:30px;
            text-align:center;
        }
        li.red{
            background-color: #ff5770;
        }
        li.blue{
            background-color: rgb(99, 99, 255);
        }
        li.grey{
            background-color: rgb(107, 107, 107);
        }
        .high {
            margin-top: 25px;
        }
        .high_rev {
            margin-bottom: 25px;
        }
    </style>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <head>
        <!-- <base href="http://cims.nyu.edu/drecco2016/"> -->
        <script src="js/jquery-2.2.4.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/p5.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/addons/p5.dom.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/0.5.11/addons/p5.sound.min.js"></script>
        <script src="./script.js"></script>
        <link rel="stylesheet" type="text/css" href="css/bootstrap.css"/>
        <link rel="stylesheet" type="text/css" href="css/game.css"/>
    </head>
    <body>
        <div class="container"> 
            
            <h1 class="page-header game-title"> Beautiful Stick Game </h1> 
            <div class="row justify-content-center"> 
            <div class="information-container col-sm-3">
                <div class="information col-sm-10">
                    <h2 class="information-header"> Game information </h2>
                    <div class="info-form">
                        <label for="player-1"> Player 1 Name </label>
                        <input type="text" class="form-control info-input" id="player-1">
                    </div>

                     <div class="info-form">
                        <label for="player-2"> Player 2 Name </label>
                        <input type="text" class="form-control info-input" id="player-2">
                    </div>

                     <div class="info-form">
                        <label for="size-of-board"> Size of Board (N) </label>
                        <input type="number" class="form-control info-input" id="size-of-board" value=10>
                    </div>

                     <div class="info-form">
                        <label for="number-of-sticks"> Maximum Stick Numbers(T) </label>
                        <input type="number" class="form-control info-input" id="number-of-sticks" value=3>
                    </div>

                     <div class="col-sm-12 alert alert-danger alert-dismissable" id="error-container">
                        <a href="#" class="close" aria-label="close">&times;</a>
                        <p id="error-message"> </p>
                    </div>
                    <div class="btn-container col-sm-12">
                        <button id="game_start" type="button" class="start-game btn btn-primary" onclick="startGame();">Start new game</button>
                    </div>

                   
                </div>
            </div>
            <div class="game col-sm-9" id='game-container'>
                    <h5 class="game" id="message">

                    </h5>
                    <div class="game col-sm-9" id="grid">

                    </div>
                    <div class="game col-sm-9 high" id="gridbuttonCont">
                        <div class="col-sm-1"></div>
                    </div>

                    <div class="game col-sm-9" id="stick">

                    </div>
                   
                    <div class="game col-sm-9 high" id="stickbuttonCont">
                        <div class="col-sm-1"></div>
                    </div>
                

            </div>
            </div>
        </div>
    </body>

    <script>
        $('.close').on('click', function() {
            $(this).parent().hide();
            console.log('worked');
        });

    </script>
</html>
