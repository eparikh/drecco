<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bubble Battle</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #1a1a2e;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #e6e6e6;
        }
        #gameCanvas {
            border: 2px solid #333;
            background: linear-gradient(to bottom, #1a1a2e, #162447);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        #gameInfo {
            width: 800px;
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 10px;
            background: #162447;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .player-info {
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            transition: all 0.3s ease;
            min-width: 200px;
        }
        .player-info.active {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        #controls {
            margin-top: 20px;
            text-align: center;
            min-width: 300px;
        }
        .error-message {
            color: #ff4444;
            font-size: 14px;
            margin-top: 5px;
            min-height: 20px;
        }
        #bubbleCounter {
            font-size: 18px;
            color: #ffd700;
            margin: 10px 0;
        }
        .player-stat {
            margin: 10px 0;
        }
        .control-item {
            margin: 10px 0;
            padding: 5px;
        }
        #timer {
            margin-top: 10px;
            color: #ffd700;
        }
        .replay-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 18px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
            z-index: 10;
        }
        .replay-button:hover {
            background: #45a049;
        }
        .hidden {
            display: none;
        }
        .give-up-button {
            padding: 8px 16px;
            font-size: 14px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .give-up-button:hover {
            background: #ff5252;
        }
        .give-up-button:disabled {
            background: #666;
            cursor: not-allowed;
            opacity: 0.7;
        }
        .solution-cost {
            color: #4fc3f7;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <button id="replayButton" class="replay-button hidden">Replay Simulation</button>
        <div id="gameInfo">
            <div id="red-player" class="player-info">
                <h3 style="color: red;">Red Player</h3>
                <div class="player-stat">
                    <span>Soap Remaining: </span>
                    <span id="redBubbles">15</span>
                </div>
                <div class="player-stat">
                    <span>Score: </span>
                    <span id="redScore">0</span>
                </div>
            </div>
            
            <div id="controls">
                <div class="control-item">
                    <span>Current Turn: </span>
                    <span id="currentTurn">Red</span>
                </div>
                <div class="control-item">
                    <span>Size (↑↓): </span>
                    <span id="bubbleSize">1</span>
                </div>
                <div class="control-item">
                    <span>Angle (1,2): </span>
                    <span id="bubbleAngle">45°</span>
                </div>
                <div class="control-item">
                    <span>Soap Required: </span>
                    <span id="bubbleCounter" class="solution-cost">3.0</span>
                </div>
                <div class="control-item" id="timer">Time: 30s</div>
                <div id="errorMessage" class="error-message"></div>
                <button id="giveUpButton" class="give-up-button">Skip all remaining turns!</button>
            </div>

            <div id="blue-player" class="player-info">
                <h3 style="color: blue;">Blue Player</h3>
                <div class="player-stat">
                    <span>Soap Remaining: </span>
                    <span id="blueBubbles">15</span>
                </div>
                <div class="player-stat">
                    <span>Score: </span>
                    <span id="blueScore">0</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Game Configuration
        const CONFIG = {
            CANVAS: {
                WIDTH: 800,
                HEIGHT: 600
            },
            BUBBLE: {
                MIN_SIZE: 2,
                MAX_SIZE: 7,
                RADIUS_MULTIPLIER: 5,
                OPACITY: 0.6,
                BOUNCE_DAMPENING: 0.8,
                SOLUTION_MULTIPLIER: 20
            },
            ANGLE: {
                RED: {
                    MIN: 95,
                    MAX: 265
                },
                BLUE: {
                    MIN: 95,
                    MAX: 265
                },
                STEP: 5
            },
            GAME: {
                BOTTOM_THIRD: 400,
                TOP_THIRD: 200,
                LEFT_BOUNDARY: 400,
                RIGHT_BOUNDARY: 400,
                INITIAL_SOLUTION: 15
            }
        };

        // Audio Context and Sound Effects Manager
        class GameAudioManager {
            constructor() {
                this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                this.sounds = {};
                this.isMuted = false;
                this.initializeSounds();
            }

            async initializeSounds() {
                this.sounds.pop = this.createPopSound();
                this.sounds.bounce = this.createBounceSound();
                this.sounds.collision = this.createCollisionSound();
                this.sounds.score = this.createScoreSound();
                this.sounds.launch = this.createLaunchSound();
                this.sounds.gameOver = this.createGameOverSound();
            }

            createPopSound() {
                return () => {
                    if (this.isMuted) return;
                    const osc = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    osc.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(783.99, this.audioContext.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.audioContext.currentTime + 0.1);
                };
            }

            createBounceSound() {
                return () => {
                    if (this.isMuted) return;
                    const osc = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    osc.frequency.setValueAtTime(220, this.audioContext.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, this.audioContext.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
                    osc.start();
                    osc.stop(this.audioContext.currentTime + 0.1);
                };
            }

            createCollisionSound() {
                return () => {
                    if (this.isMuted) return;
                    const osc = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    const filter = this.audioContext.createBiquadFilter();
                    osc.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(1000, this.audioContext.currentTime);
                    osc.frequency.setValueAtTime(100, this.audioContext.currentTime);
                    osc.frequency.linearRampToValueAtTime(500, this.audioContext.currentTime + 0.15);
                    gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, this.audioContext.currentTime + 0.15);
                    osc.start();
                    osc.stop(this.audioContext.currentTime + 0.15);
                };
            }

            createScoreSound() {
                return () => {
                    if (this.isMuted) return;
                    const osc = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    osc.frequency.setValueAtTime(523.25, this.audioContext.currentTime);
                    osc.frequency.setValueAtTime(659.25, this.audioContext.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, this.audioContext.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.2, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                    osc.start();
                    osc.stop(this.audioContext.currentTime + 0.3);
                };
            }

            createLaunchSound() {
                return () => {
                    if (this.isMuted) return;
                    const osc = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    osc.frequency.setValueAtTime(220, this.audioContext.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, this.audioContext.currentTime + 0.2);
                    gainNode.gain.setValueAtTime(0.1, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                    osc.start();
                    osc.stop(this.audioContext.currentTime + 0.2);
                };
            }

            createGameOverSound() {
                return () => {
                    if (this.isMuted) return;
                    const osc = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    osc.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    osc.frequency.setValueAtTime(440, this.audioContext.currentTime);
                    osc.frequency.linearRampToValueAtTime(110, this.audioContext.currentTime + 0.5);
                    gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                    gainNode.gain.linearRampToValueAtTime(0.01, this.audioContext.currentTime + 0.5);
                    osc.start();
                    osc.stop(this.audioContext.currentTime + 0.5);
                };
            }

            toggleMute() {
                this.isMuted = !this.isMuted;
                return this.isMuted;
            }

            playSound(soundName) {
                if (this.sounds[soundName]) {
                    this.sounds[soundName]();
                }
            }
        }

        const gameAudio = new GameAudioManager();

        class Bubble {
            constructor(x, y, size, angle, color) {
                this.x = x;
                this.y = y;
                this.size = size;
                this.radius = size * CONFIG.BUBBLE.RADIUS_MULTIPLIER;
                this.angle = angle * Math.PI / 180;
                this.color = color;
                this.minSeparationSpeed = 2;
                this.solutionCost = this.calculateSolutionCost();

                this.speed = ((5 - this.size / 2) * (5 - this.size / 2)) / 2;
                
                if (color === 'red') {
                    this.dx = Math.sin(this.angle) * this.speed;
                    this.dy = -Math.cos(this.angle) * this.speed;
                } else {
                    this.dx = -Math.sin(this.angle) * this.speed;
                    this.dy = -Math.cos(this.angle) * this.speed;                
                }
                
                this.volume = Math.PI * this.radius;
                this.destroyed = false;
            }

            calculateSolutionCost() {
                if (this.size <= 3) {
                    return 1;
                }
                if (this.size <= 5) {
                    return 2;
                }
                if (this.size <= 7) {
                    return 3;
                }
                // return this.radius / 3;
            }

            update() {
                this.x += this.dx;
                if (this.dy >= -0.1 && this.dy <= 0) {
                    this.dy = -0.1;
                }
                if (this.y == 0 && this.dy >= 0) {
                    this.dy = -0.2;
                    gameAudio.playSound('bounce');
                }
                this.y += this.dy;

                if (this.x - this.radius < 0 || this.x + this.radius > CONFIG.CANVAS.WIDTH) {
                    this.dx = -this.dx;
                    this.x = Math.max(this.radius, Math.min(CONFIG.CANVAS.WIDTH - this.radius, this.x));
                    gameAudio.playSound('bounce');
                }

                if (this.y + this.radius > CONFIG.CANVAS.HEIGHT) {
                    this.dy = -this.dy * CONFIG.BUBBLE.BOUNCE_DAMPENING;
                    this.y = CONFIG.CANVAS.HEIGHT - this.radius;
                    gameAudio.playSound('bounce');
                }

                if (this.y - this.radius < 0) {
                    gameAudio.playSound('score');
                    return 'score';
                }

                return 'active';
            }

            draw(ctx, isPreview = false) {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = isPreview ? `rgba(${this.color === 'red' ? '255,0,0,0.5' : '0,0,255,0.5'})` : this.color;
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.stroke();
            }

            collideWith(other) {
                const dx = other.x - this.x;
                const dy = other.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < this.radius + other.radius) {
                    const nx = dx / distance;
                    const ny = dy / distance;
                    
                    const overlap = (this.radius + other.radius - distance) / 2;
                    this.x -= overlap * nx;
                    this.y -= overlap * ny;
                    other.x += overlap * nx;
                    other.y += overlap * ny;

                    const relativeVelocity = (this.dx - other.dx) * nx + (this.dy - other.dy) * ny;
                    
                    if (Math.abs(relativeVelocity) < this.minSeparationSpeed) {
                        const separationVelocity = this.minSeparationSpeed;
                        this.dx -= nx * separationVelocity / 2;
                        this.dy -= ny * separationVelocity / 2;
                        other.dx += nx * separationVelocity / 2;
                        other.dy += ny * separationVelocity / 2;
                    }
                    
                    return true;
                }
                return false;
            }
        }

        class Game {
            constructor() {
                this.canvas = document.getElementById('gameCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.gameOverInfo = null;
                this.gameTimer = null;
                this.timeLeft = 30;
                this.timerInterval = null;
                this.replayButton = document.getElementById('replayButton');
                this.playerGaveUp = { red: false, blue: false };
                this.solutionLeft = { red: CONFIG.GAME.INITIAL_SOLUTION, blue: CONFIG.GAME.INITIAL_SOLUTION };
                this.scores = { red: 0, blue: 0 };
                this.setupEventListeners();
                this.reset();
                this.savedBubbles = [];
                requestAnimationFrame(this.gameLoop.bind(this));
            }

            reset() {
                this.bubbles = [];
                this.placedBubbles = [];
                this.currentPlayer = 'red';
                this.gameState = 'placing';
                this.currentSize = this.getMaxPossibleSize();
                this.currentAngle = 135;
                this.scores = { red: 0, blue: 0 };
                this.solutionLeft = { red: CONFIG.GAME.INITIAL_SOLUTION, blue: CONFIG.GAME.INITIAL_SOLUTION };
                this.playerGaveUp = { red: false, blue: false };
                this.mouseX = 0;
                this.mouseY = CONFIG.GAME.BOTTOM_THIRD;
                this.errorMessage = '';
                this.mouseInValidZone = false;
                
                if (this.gameTimer) {
                    clearTimeout(this.gameTimer);
                    this.gameTimer = null;
                }
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                this.timeLeft = 30;
                document.getElementById('timer').textContent = `Time: ${this.timeLeft}s`;
                this.savedBubbles = [];
                this.replayButton.classList.add('hidden');
            }

            handleGiveUp() {
                if (this.gameState === 'placing') {
                    this.playerGaveUp[this.currentPlayer] = true;
                    this.switchToNextValidPlayer();
                }
            }

            switchToNextValidPlayer() {
                const nextPlayer = this.currentPlayer === 'red' ? 'blue' : 'red';
                
                // First check if next player can play
                if (!this.playerGaveUp[nextPlayer] && this.canPlayerPlace(nextPlayer)) {
                    this.currentPlayer = nextPlayer;
                    this.currentAngle = 135;
                    this.currentSize = this.getMaxPossibleSize(); // Update size for new player
                    this.updateUI();
                } else if (!this.playerGaveUp[this.currentPlayer] && this.canPlayerPlace(this.currentPlayer)) {
                    // Current player can still play, keep their turn
                    this.currentSize = this.getMaxPossibleSize(); // Update size for current player
                    this.updateUI();
                    return;
                } else {
                    // Neither player can play, start simulation
                    gameAudio.playSound('launch');
                    this.startSimulation();
                }
                
                this.updateUI();
            }


            canPlayerPlace(player) {
                if (this.playerGaveUp[player]) return false;
                
                // Check if player has enough solution for smallest possible bubble
                const minBubble = new Bubble(0, 0, CONFIG.BUBBLE.MIN_SIZE, 135, player);
                return this.solutionLeft[player] >= minBubble.solutionCost;
            }

            setupEventListeners() {
                this.canvas.addEventListener('mousemove', (e) => {
                    if (this.gameState === 'placing') {
                        const rect = this.canvas.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left;
                        const mouseY = e.clientY - rect.top;

                        if (this.currentPlayer === 'red') {
                            this.mouseInValidZone = mouseX <= CONFIG.GAME.LEFT_BOUNDARY;
                        } else {
                            this.mouseInValidZone = mouseX >= CONFIG.GAME.RIGHT_BOUNDARY;
                        }

                        if (this.mouseInValidZone) {
                            this.mouseX = mouseX;
                            this.mouseY = mouseY;

                            if (this.currentPlayer === 'red') {
                                this.mouseX = Math.max(
                                    this.currentSize * CONFIG.BUBBLE.RADIUS_MULTIPLIER,
                                    Math.min(CONFIG.GAME.LEFT_BOUNDARY - this.currentSize * CONFIG.BUBBLE.RADIUS_MULTIPLIER, 
                                        this.mouseX)
                                );
                            } else {
                                this.mouseX = Math.max(
                                    CONFIG.GAME.RIGHT_BOUNDARY + this.currentSize * CONFIG.BUBBLE.RADIUS_MULTIPLIER,
                                    Math.min(CONFIG.CANVAS.WIDTH - this.currentSize * CONFIG.BUBBLE.RADIUS_MULTIPLIER, 
                                        this.mouseX)
                                );
                            }

                            this.mouseY = Math.max(
                                CONFIG.GAME.BOTTOM_THIRD,
                                Math.min(CONFIG.CANVAS.HEIGHT - this.currentSize * CONFIG.BUBBLE.RADIUS_MULTIPLIER,
                                    this.mouseY)
                            );
                        }
                    }
                });

                document.addEventListener('keydown', (e) => {
                    if (this.gameState !== 'placing') return;

                    const angleConstraints = this.currentPlayer === 'red' ? 
                        CONFIG.ANGLE.RED : CONFIG.ANGLE.BLUE;

                    switch (e.key) {
                        case 'ArrowUp': {
                            const maxPossibleSize = this.getMaxPossibleSize();
                            this.currentSize = Math.min(maxPossibleSize, this.currentSize + 1);
                            break;
                        }
                        case 'ArrowDown':
                            this.currentSize = Math.max(CONFIG.BUBBLE.MIN_SIZE, this.currentSize - 1);
                            break;
                        case '1':
                            this.currentAngle = Math.max(angleConstraints.MIN, 
                                this.currentAngle - CONFIG.ANGLE.STEP);
                            break;
                        case '2':
                            this.currentAngle = Math.min(angleConstraints.MAX, 
                                this.currentAngle + CONFIG.ANGLE.STEP);
                            break;
                        case ' ':
                            this.placeBubble();
                            break;
                    }
                    this.updateUI();
                });

                this.canvas.addEventListener('click', () => {
                    if (this.gameState === 'placing') {
                        this.placeBubble();
                    }
                });

                document.getElementById('giveUpButton').addEventListener('click', () => this.handleGiveUp());
                this.replayButton.addEventListener('click', () => this.replaySimulation());
            }

            getMaxPossibleSize() {
                let size = CONFIG.BUBBLE.MAX_SIZE;
                while (size > CONFIG.BUBBLE.MIN_SIZE) {
                    const testBubble = new Bubble(0, 0, size, this.currentAngle, this.currentPlayer);
                    if (testBubble.solutionCost <= this.solutionLeft[this.currentPlayer]) {
                        return size;
                    }
                    size--;
                }
                return CONFIG.BUBBLE.MIN_SIZE;
            }

            placeBubble() {
                if (!this.mouseInValidZone || this.playerGaveUp[this.currentPlayer]) {
                    return;
                }

                this.mouseInValidZone = false;

                const newBubble = new Bubble(
                    this.mouseX,
                    this.mouseY,
                    this.currentSize,
                    this.currentAngle,
                    this.currentPlayer
                );

                const tempBubbles = this.placedBubbles.map(b => ({...b}));
    
                // Check collisions without modifying original bubbles
                const hasCollision = tempBubbles.some(b => {
                    const dx = b.x - newBubble.x;
                    const dy = b.y - newBubble.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    return distance < (b.radius + newBubble.radius);
                });

                if (hasCollision) {
                    this.errorMessage = 'Bubbles cannot overlap';
                    this.updateUI();
                    return;
                }

                if (this.solutionLeft[this.currentPlayer] < newBubble.solutionCost) {
                    this.errorMessage = 'Not enough solution';
                    this.currentSize = this.getMaxPossibleSize(); // Reset to max possible size
                    this.switchToNextValidPlayer();
                    return;
                }

                this.solutionLeft[this.currentPlayer] -= newBubble.solutionCost;
                this.placedBubbles.push(newBubble);
                this.errorMessage = '';

                this.switchToNextValidPlayer();
            }

            startSimulation() {
                this.gameState = 'simulating';
                this.savedBubbles = this.placedBubbles.map(bubble => ({
                    x: bubble.x,
                    y: bubble.y,
                    size: bubble.size,
                    angle: bubble.angle * 180 / Math.PI,
                    color: bubble.color
                }));

                this.bubbles = [...this.placedBubbles];
                this.placedBubbles = [];

                this.resetTimer();
                this.startTimer();
            }

            replaySimulation() {
                this.replayButton.classList.add('hidden');
                this.scores = { red: 0, blue: 0 };
                this.bubbles = [];

                this.bubbles = this.savedBubbles.map(data => 
                    new Bubble(data.x, data.y, data.size, data.angle, data.color)
                );

                this.gameState = 'simulating';
                gameAudio.playSound('launch');

                this.resetTimer();
                this.startTimer();

                this.updateUI();
            }

            resetTimer() {
                if (this.gameTimer) {
                    clearTimeout(this.gameTimer);
                }
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                }
                this.timeLeft = 30;
                document.getElementById('timer').textContent = `Time: ${this.timeLeft}s`;
            }

            startTimer() {
                this.gameTimer = setTimeout(() => {
                    if (this.gameState === 'simulating') {
                        this.endGame();
                    }
                }, 30000);

                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    document.getElementById('timer').textContent = `Time: ${this.timeLeft}s`;
                    if (this.timeLeft <= 0) {
                        clearInterval(this.timerInterval);
                    }
                }, 1000);
            }

            handleCollisions() {
                for (let i = 0; i < this.bubbles.length; i++) {
                    for (let j = i + 1; j < this.bubbles.length; j++) {
                        const b1 = this.bubbles[i];
                        const b2 = this.bubbles[j];

                        if (!b1.destroyed && !b2.destroyed && b1.collideWith(b2)) {
                            if (b1.color !== b2.color) {
                                const collisionY = (b1.y + b2.y) / 2;

                                if (collisionY <= CONFIG.GAME.BOTTOM_THIRD) {
                                    b1.destroyed = true;
                                    b2.destroyed = true;
                                    gameAudio.playSound('collision');
                                }
                            }
                        }
                    }
                }
            }

            updateUI() {
                document.getElementById('currentTurn').textContent = 
                    this.gameState === 'simulating' ? 'Simulating' : 
                    this.currentPlayer.charAt(0).toUpperCase() + this.currentPlayer.slice(1);
                document.getElementById('bubbleSize').textContent = this.currentSize;
                document.getElementById('bubbleAngle').textContent = this.currentAngle + '°';
                document.getElementById('redScore').textContent = Math.round(this.scores.red);
                document.getElementById('blueScore').textContent = Math.round(this.scores.blue);
                
                // Update solution information
                document.getElementById('redBubbles').textContent = this.playerGaveUp['red'] ? 'Gave Up' : 
                    this.solutionLeft.red.toFixed(1);
                document.getElementById('blueBubbles').textContent = this.playerGaveUp['blue'] ? 'Gave Up' : 
                    this.solutionLeft.blue.toFixed(1);
                
                // Show current bubble cost
                const previewBubble = new Bubble(0, 0, this.currentSize, this.currentAngle, this.currentPlayer);
                document.getElementById('bubbleCounter').textContent = 
                    `Cost: ${previewBubble.calculateSolutionCost().toFixed(1)}`;
                
                document.getElementById('errorMessage').textContent = this.errorMessage;

                // Update player status and give up button
                document.getElementById('red-player').classList.toggle('active', 
                    this.currentPlayer === 'red' && !this.playerGaveUp['red']);
                document.getElementById('blue-player').classList.toggle('active', 
                    this.currentPlayer === 'blue' && !this.playerGaveUp['blue']);

                const giveUpButton = document.getElementById('giveUpButton');
                giveUpButton.disabled = this.gameState !== 'placing' || 
                                      this.playerGaveUp[this.currentPlayer];
            }

            gameLoop() {
                this.ctx.clearRect(0, 0, CONFIG.CANVAS.WIDTH, CONFIG.CANVAS.HEIGHT);

                // Draw boundaries
                this.ctx.beginPath();
                this.ctx.setLineDash([5, 5]);
                this.ctx.moveTo(0, CONFIG.GAME.BOTTOM_THIRD);
                this.ctx.lineTo(CONFIG.CANVAS.WIDTH, CONFIG.GAME.BOTTOM_THIRD);
                this.ctx.moveTo(0, CONFIG.GAME.TOP_THIRD);
                this.ctx.lineTo(CONFIG.CANVAS.WIDTH, CONFIG.GAME.TOP_THIRD);
                this.ctx.strokeStyle = 'gray';
                this.ctx.stroke();
                this.ctx.setLineDash([]);

                // Draw side boundaries
                this.ctx.beginPath();
                this.ctx.moveTo(CONFIG.GAME.LEFT_BOUNDARY, 0);
                this.ctx.lineTo(CONFIG.GAME.LEFT_BOUNDARY, CONFIG.CANVAS.HEIGHT);
                this.ctx.moveTo(CONFIG.GAME.RIGHT_BOUNDARY, 0);
                this.ctx.lineTo(CONFIG.GAME.RIGHT_BOUNDARY, CONFIG.CANVAS.HEIGHT);
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                this.ctx.stroke();

                if (this.gameState === 'simulating') {
                    this.handleCollisions();

                    for (let i = this.bubbles.length - 1; i >= 0; i--) {
                        const bubble = this.bubbles[i];
                        const status = bubble.update();

                        if (status === 'score') {
                            this.scores[bubble.color] += Math.round(bubble.volume);
                            this.bubbles.splice(i, 1);
                            this.showScorePopup(bubble.x, 20, Math.round(bubble.volume), bubble.color);
                        } else if (bubble.destroyed) {
                            this.bubbles.splice(i, 1);
                        } else {
                            bubble.draw(this.ctx);
                        }
                    }

                    if (this.bubbles.length === 0) {
                        this.endGame();
                    }
                } else if (this.gameState === 'placing') {
                    // Draw placed bubbles with their angles
                    this.placedBubbles.forEach(bubble => {
                        bubble.draw(this.ctx);

                        // Draw angle line for placed bubbles
                        this.ctx.beginPath();
                        this.ctx.moveTo(bubble.x, bubble.y);
                        const angle = bubble.angle;
                        const lineLength = bubble.radius + 20;
                        const dx = Math.sin(angle) * lineLength;
                        const dy = -Math.cos(angle) * lineLength;
                        this.ctx.lineTo(
                            bubble.x + (bubble.color === 'red' ? dx : -dx),
                            bubble.y + dy
                        );
                        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        this.ctx.stroke();
                    });

                    // Draw preview bubble only if mouse is in valid zone
                    if (this.solutionLeft[this.currentPlayer] > 0 && 
                        this.mouseInValidZone && 
                        !this.playerGaveUp[this.currentPlayer]) {
                        const previewBubble = new Bubble(
                            this.mouseX,
                            this.mouseY,
                            this.currentSize,
                            this.currentAngle,
                            this.currentPlayer
                        );
                        previewBubble.draw(this.ctx, true);

                        // Draw trajectory line for preview
                        this.ctx.beginPath();
                        this.ctx.moveTo(this.mouseX, this.mouseY);
                        const angle = this.currentAngle * Math.PI / 180;
                        const lineLength = 50;
                        const dx = Math.sin(angle) * lineLength;
                        const dy = -Math.cos(angle) * lineLength;
                        this.ctx.lineTo(
                            this.mouseX + (this.currentPlayer === 'red' ? dx : -dx),
                            this.mouseY + dy
                        );
                        this.ctx.strokeStyle = this.currentPlayer;
                        this.ctx.stroke();
                    }
                }

                // Draw game over screen if game has ended
                if (this.gameState === 'ended' && this.gameOverInfo) {
                    this.drawGameOverScreen();
                }

                requestAnimationFrame(this.gameLoop.bind(this));
            }

            showScorePopup(x, y, points, color) {
                const popup = document.createElement('div');
                popup.style.position = 'absolute';
                popup.style.left = `${x}px`;
                popup.style.top = `${y}px`;
                popup.style.color = color;
                popup.style.fontSize = '24px';
                popup.style.fontWeight = 'bold';
                popup.style.textShadow = '2px 2px 4px rgba(0,0,0,0.5)';
                popup.style.transition = 'all 0.5s ease-out';
                popup.style.pointerEvents = 'none';
                popup.textContent = `+${points}`;

                document.body.appendChild(popup);

                setTimeout(() => {
                    popup.style.transform = 'translateY(-30px)';
                    popup.style.opacity = '0';
                }, 50);

                setTimeout(() => {
                    popup.remove();
                }, 600);

                this.updateUI();
            }

            drawGameOverScreen() {
                this.replayButton.classList.remove('hidden');

                // Add semi-transparent overlay
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                this.ctx.fillRect(0, 0, CONFIG.CANVAS.WIDTH, CONFIG.CANVAS.HEIGHT);

                // Draw game over text
                this.ctx.fillStyle = 'white';
                this.ctx.font = '48px Arial';
                this.ctx.textAlign = 'center';

                const centerX = CONFIG.CANVAS.WIDTH / 2;
                const centerY = CONFIG.CANVAS.HEIGHT / 2;

                if (this.gameOverInfo.winner === 'Tie') {
                    this.ctx.fillText('Game Over - Tie!', centerX, centerY - 50);
                } else {
                    this.ctx.fillText(
                        `Game Over - ${this.gameOverInfo.winner} Wins!`,
                        centerX,
                        centerY - 50
                    );
                }

                // Draw final scores
                this.ctx.font = '24px Arial';
                this.ctx.fillText(
                    `Final Scores: Red ${this.gameOverInfo.redScore} - Blue ${this.gameOverInfo.blueScore}`,
                    centerX,
                    centerY + 20
                );
            }

            endGame() {
                gameAudio.playSound('gameOver');
                if (this.gameTimer) {
                    clearTimeout(this.gameTimer);
                    this.gameTimer = null;
                }
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                this.gameState = 'ended';
                const winner = this.scores.red > this.scores.blue ? 'Red' : 
                    this.scores.red < this.scores.blue ? 'Blue' : 'Tie';

                this.gameOverInfo = {
                    winner: winner,
                    redScore: Math.round(this.scores.red),
                    blueScore: Math.round(this.scores.blue)
                };
            }
        }

        window.onload = () => {
            window.game = new Game();
        };
    </script>
