<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Detective</title>
    <link rel="stylesheet" href="./src/style.css">
</head>
<body>
    <div class="game-container">
        <div id="overlay" class="overlay">
            <div class="overlay-content">
                <h2>Game Setup</h2>
                <label for="player1">Player 1 Name:</label>
                <input type="text" id="player1" name="player1" placeholder="Alice">
                <label for="player2">Player 2 Name:</label>
                <input type="text" id="player2" name="player2" placeholder="Bob">
                <br>
                <label for="nCoins">Number of Coins: </label>
                <output for="nCoins" id="coinsValue">4</output>
                <input type="range" id="nCoins" name="nCoins" value="4" min="3" max="9" step="1" oninput="document.getElementById('coinsValue').textContent = this.value">
                <label for="nGuesses">Number of Guesses per player: </label>
                <output for="nGuesses" id="guessesValue">3</output>
                <input type="range" id="nGuesses" name="nGuesses" value="3" min="1" max="9" step="1" oninput="document.getElementById('guessesValue').textContent = this.value"><br>
                <label for="difficulty">Difficulty:</label><br>
                <output for="difficulty" id="difficultyValue">Coin odds are <b>75/25</b> (Easy)</output>
                <input type="range" id="difficulty" name="difficulty" value="25" min="20" max="45" step="5" oninput="updateDifficultyMsg()">
                <label for="showStats">Show coin statistics?</label>
                <input type="checkbox" id="showStats" name="showStats" checked>
                <button onclick="startGame()">Start Game</button>
                <script>
                  function updateDifficultyMsg(){
                    let bias = document.getElementById("difficulty").value;
                    let difficulty = Math.floor(bias/10);
                    let message;
                    switch(difficulty){
                      case 1: message="Very Easy";break;
                      case 2: message="Easy";break;
                      case 3: message="Medium";break;
                      case 4: message="Hard";break;
                      default: message="";break;
                    }
                    document.getElementById("difficultyValue").innerHTML =`Coin odds are <b>${100-bias}/${bias}</b> (${message})`
                  }
                </script>
            </div>
        </div>
        <h1>Coin Detective</h1>
        <div class="message" id="status"></div>
        <div class="coins-row" id="coins"></div>
        <div class="stats" id="stats"></div>
        <div class="biases" id="biases"></div>
        <div class="grid" id="grid"></div>
        <div class="controls">
            <button id="make-guess-btn" class="make-guess-btn" onclick="showOptions()">Make Guess...</button>
            <button id='heads-btn' class="guess-btn" onclick="makeGuess('H')">Heads</button>
            <button id='tails-btn' class="guess-btn" onclick="makeGuess('T')">Tails</button>
        </div>
        <div class="controls">
          <button id="reset-btn" class="reset-btn" onclick="resetGame()">Restart</button>
        </div>
        <div class="message" id="message"></div>
    </div>
    <script src="./src/index.js"></script>
</body>
</html>
