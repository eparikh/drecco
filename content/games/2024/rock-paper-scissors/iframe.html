<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock-Paper-Scissors Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            position: relative;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }

        h1, h2, h3 {
            margin: 10px 0;
        }

        .players {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            margin: 40px 0 20px;
        }

        .player {
            width: 45%;
            border: 1px solid #ccc;
            padding: 10px;
            background-color: #fff;
            border-radius: 10px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }

        .declaration-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .declaration-buttons label {
            margin: 10px;
            cursor: pointer;
            position: relative;
        }

        .declaration-buttons input[type="radio"] {
            display: none;
        }

        .declaration-buttons img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ccc;
            transition: border-color 0.3s, transform 0.2s;
        }

        .declaration-buttons input[type="radio"]:checked + img,
        .declaration-buttons img:hover {
            border-color: #888;
            transform: scale(1.1);
        }

        .checkmark {
            display: none;
            margin-top: 5px;
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        .declaration-buttons input[type="radio"]:checked + img + .checkmark {
            display: block;
        }

        .declared-choice {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ccc;
            overflow: hidden;
            background-color: #fff;
            cursor: default;
            transition: box-shadow 0.3s;
        }

        .declared-choice img {
            width: 100%;
            height: 100%;
        }

        .declared-choice:hover {
            border-color: #ccc;
        }

        .move-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin: 10px;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .move-button img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid #ccc;
            transition: border-color 0.3s, transform 0.2s;
        }

        .move-button:hover img {
            border-color: #888;
            transform: scale(1.1);
        }

        .chosen-button {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ccc;
            overflow: hidden;
            position: absolute;
            background-color: #fff;
            box-shadow: 0 0 10px transparent;
            transition: box-shadow 0.3s;
        }

        .chosen-button img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        #chosen1 {
            left: 50px;
            top: 50px;
            box-shadow: 0 0 10px blue;
        }

        #chosen2 {
            right: 50px;
            top: 50px;
            box-shadow: 0 0 10px red;
        }

        .result-area p {
            width: 100%;
            text-align: center;
            margin-top: 160px;
            font-size: 24px;
            color: gray;
        }

        .round-result {
            margin-top: 20px;
            font-size: 24px;
            color: green;
        }

        .cumulative-results {
            position: absolute;
            top: 10px;
            left: 160px;
            width: 200px;
            background-color: #ffffff;
            border: 2px solid #6c63ff;
            border-radius: 8px;
            padding: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            font-size: 14px;
            text-align: center;
            z-index: 999;
        }

        .cumulative-results h3 {
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            color: #6c63ff;
            padding: 5px 0;
            border-bottom: 2px solid #6c63ff;
        }

        .cumulative-results table {
            margin: 5px auto 0;
            border-collapse: collapse;
            width: 100%;
        }

        .cumulative-results th,
        .cumulative-results td {
            text-align: center;
            font-size: 14px;
            color: #333;
            padding: 5px;
            border: none;
        }

        .cumulative-results th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        .cumulative-results td {
            background-color: #fff;
        }

        .cumulative-results td.adhered {
            background-color: #e0e7ff;
            font-weight: bold;
            color: #333;
        }

        @media (max-width: 600px) {
            .cumulative-results {
                width: 160px;
                font-size: 12px;
            }
            .cumulative-results th,
            .cumulative-results td {
                padding: 3px;
            }
        }

        .game-image {
            margin-top: 30px;
        }

        .hidden {
            display: none;
        }

        .error {
            color: red;
        }

        /* 新增的start-box样式，与score board类似的紫色长方形框 */
        .start-box {
            width: 400px;
            background-color: #ffffff;
            border: 2px solid #6c63ff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 难度选择阶段 -->
    <div id="start-phase">
        <div class="start-box">
            <h1>Welcome to the Rock-Paper-Scissors Game</h1>
            <p class="error" id="start-error"></p>
            <form id="start-form">
                <label>Player 1 Name: <input type="text" id="player1-name" value="Player 1" required></label><br><br>
                <label>Player 2 Name: <input type="text" id="player2-name" value="Player 2" required></label><br><br>
                <label>Total Rounds: <input type="number" id="total-rounds" value="5" min="1" required></label><br><br>
                <label>Select Difficulty:</label><br>
                <label>
                    <input type="radio" name="difficulty" value="easy" required aria-label="Easy Mode">
                    Easy (Rock-Paper-Scissors)
                </label><br>
                <label>
                    <input type="radio" name="difficulty" value="difficult" required aria-label="Difficult Mode">
                    Difficult (Rock-Paper-Scissors-Lizard-Spock)
                </label><br><br>
                <button type="submit">Start Game</button>
            </form>
        </div>
    </div>

    <!-- 声明阶段 -->
    <div id="declaration-phase" class="hidden">
        <h1>Round <span id="current-round"></span> - Remaining Rounds: <span id="remaining-rounds"></span></h1>
        <h2>Declaration Phase</h2>
        <p class="error" id="declaration-error"></p>
        <p id="first-player-indicator-decl" style="font-weight:bold; color:#333;"></p>
        <form id="declaration-form">
            <div class="players">
                <div class="player" id="player1-declaration">
                    <h2 style="color: blue;" id="player1-title"></h2>
                    <p>Score: <span id="player1-score"></span></p>
                    <div class="declaration-buttons" id="declaration1-buttons"></div>
                </div>
                <div class="player" id="player2-declaration">
                    <h2 style="color: red;" id="player2-title"></h2>
                    <p>Score: <span id="player2-score"></span></p>
                    <div class="declaration-buttons" id="declaration2-buttons"></div>
                </div>
            </div>
            <input type="submit" value="Submit Declarations">
        </form>
    </div>

    <!-- 出招阶段 -->
    <div id="game-phase" class="hidden">
        <h1>Round <span id="current-round-game"></span> - Remaining Rounds: <span id="remaining-rounds-game"></span></h1>
        <h2>Game Phase</h2>
        <p id="first-player-indicator-game" style="font-weight:bold; color:#333;"></p>
        <div class="players">
            <div class="player" id="player1-game">
                <h2 style="color: blue;" id="player1-title-game"></h2>
                <p>Score: <span id="player1-score-game"></span></p>
                <div class="declaration-buttons" id="play1-buttons"></div>
            </div>
            <div class="player" id="player2-game">
                <h2 style="color: red;" id="player2-title-game"></h2>
                <p>Score: <span id="player2-score-game"></span></p>
                <div class="declaration-buttons" id="play2-buttons"></div>
            </div>
        </div>
    </div>

    <!-- 结果阶段 -->
    <div id="result-phase" class="hidden">
        <h1>Round <span id="current-round-result"></span> - Remaining Rounds: <span id="remaining-rounds-result"></span></h1>
        <h2>Result Phase</h2>
        <div class="players">
            <div class="player" id="player1-result">
                <h2 style="color: blue;" id="player1-title-result"></h2>
                <p>Score: <span id="player1-score-result"></span></p>
            </div>
            <div class="player" id="player2-result">
                <h2 style="color: red;" id="player2-title-result"></h2>
                <p>Score: <span id="player2-score-result"></span></p>
            </div>
        </div>
        <div class="result-area">
            <div class="chosen-button" id="chosen1">
                <img id="chosen1-img" alt="">
            </div>
            <div class="chosen-button" id="chosen2">
                <img id="chosen2-img" alt="">
            </div>
        </div>
        <div class="round-result">
            <p id="round-winner-text"></p>
        </div>
        <button id="next-round-button">Next Round</button>
    </div>

    <!-- 最终结果 -->
    <div id="final-result" class="hidden">
        <h1>Game Over!</h1>
        <p><span id="player1-final-name"></span>'s final score: <span id="player1-final-score"></span></p>
        <p><span id="player2-final-name"></span>'s final score: <span id="player2-final-score"></span></p>
        <h2 id="final-winner-text"></h2>
        <button id="restart-game-button">Restart Game</button>
    </div>

    <!-- 计分板 -->
    <div id="score-board" class="cumulative-results hidden">
        <h3>Score Board</h3>
        <table id="score-table"></table>
    </div>

    <div class="game-image hidden" id="difficult-image">
        <img src="images/RockPaperScissorsLizardSpock.jpg" alt="Rock Paper Scissors Lizard Spock">
    </div>

    <script>
        const CHOICES_EASY = ['rock', 'paper', 'scissors'];
        const RULES_EASY = {
            'rock': ['scissors'],
            'paper': ['rock'],
            'scissors': ['paper']
        };

        const CHOICES_DIFFICULT = ['rock', 'paper', 'scissors', 'lizard', 'spock'];
        const RULES_DIFFICULT = {
            'rock': ['scissors', 'lizard'],
            'paper': ['rock', 'spock'],
            'scissors': ['paper', 'lizard'],
            'lizard': ['spock', 'paper'],
            'spock': ['scissors', 'rock']
        };

        let gameState = {
            player1Name: "Player 1",
            player2Name: "Player 2",
            difficulty: "easy",
            totalRounds: 5,
            currentRound: 1,
            score1: 0,
            score2: 0,
            declaration1: null,
            declaration2: null,
            play1: null,
            play2: null,
            winner: null,
            roundScores: {},
            roundDeclarationAdherence: {},
            roundWinners: {},
            firstPlayer: 'player1',
            secondPlayer: 'player2'
        };

        document.getElementById('start-form').addEventListener('submit', startGame);
        document.getElementById('declaration-form').addEventListener('submit', submitDeclarations);
        document.getElementById('next-round-button').addEventListener('click', nextRound);
        document.getElementById('restart-game-button').addEventListener('click', restartGame);

        function startGame(e) {
            e.preventDefault();
            const p1 = document.getElementById('player1-name').value.trim() || 'Player 1';
            const p2 = document.getElementById('player2-name').value.trim() || 'Player 2';
            const rounds = parseInt(document.getElementById('total-rounds').value) || 5;

            const difficultyRadios = document.querySelectorAll('input[name="difficulty"]');
            let diffSelected = null;
            for (let r of difficultyRadios) {
                if (r.checked) {
                    diffSelected = r.value;
                    break;
                }
            }

            if (!diffSelected) {
                document.getElementById('start-error').textContent = 'Please select a difficulty level.';
                return;
            }

            gameState.player1Name = p1;
            gameState.player2Name = p2;
            gameState.totalRounds = rounds;
            gameState.difficulty = diffSelected;
            gameState.currentRound = 1;
            gameState.score1 = 0;
            gameState.score2 = 0;
            gameState.declaration1 = null;
            gameState.declaration2 = null;
            gameState.play1 = null;
            gameState.play2 = null;
            gameState.winner = null;
            gameState.roundScores = {};
            gameState.roundDeclarationAdherence = {};
            gameState.roundWinners = {};

            document.getElementById('start-error').textContent = '';
            updateFirstPlayer();
            showDeclarationPhase();
        }

        function updateFirstPlayer() {
            if (gameState.currentRound % 2 === 1) {
                gameState.firstPlayer = 'player1';
                gameState.secondPlayer = 'player2';
            } else {
                gameState.firstPlayer = 'player2';
                gameState.secondPlayer = 'player1';
            }
        }

        function showDeclarationPhase() {
            hideAllPhases();
            document.getElementById('declaration-phase').classList.remove('hidden');
            updateDeclarationPhaseUI();
        }

        function submitDeclarations(e) {
            e.preventDefault();
            const decl1 = document.querySelector('input[name="declaration1"]:checked');
            const decl2 = document.querySelector('input[name="declaration2"]:checked');

            if (!decl1 || !decl2) {
                document.getElementById('declaration-error').textContent = 'Both players must declare their choices.';
                return;
            }

            gameState.declaration1 = decl1.value;
            gameState.declaration2 = decl2.value;

            document.getElementById('declaration-error').textContent = '';
            showGamePhase();
        }

        function showGamePhase() {
            hideAllPhases();
            document.getElementById('game-phase').classList.remove('hidden');
            updateGamePhaseUI();
        }

        function showResultPhase() {
            hideAllPhases();
            document.getElementById('result-phase').classList.remove('hidden');
            updateResultPhaseUI();
        }

        function showFinalResult() {
            hideAllPhases();
            document.getElementById('final-result').classList.remove('hidden');
            updateFinalResultUI();
        }

        function nextRound() {
            if (gameState.currentRound >= gameState.totalRounds) {
                showFinalResult();
            } else {
                gameState.currentRound += 1;
                gameState.declaration1 = null;
                gameState.declaration2 = null;
                gameState.play1 = null;
                gameState.play2 = null;
                gameState.winner = null;
                updateFirstPlayer();
                showDeclarationPhase();
            }
        }

        function restartGame() {
            gameState = {
                player1Name: "Player 1",
                player2Name: "Player 2",
                difficulty: "easy",
                totalRounds: 5,
                currentRound: 1,
                score1: 0,
                score2: 0,
                declaration1: null,
                declaration2: null,
                play1: null,
                play2: null,
                winner: null,
                roundScores: {},
                roundDeclarationAdherence: {},
                roundWinners: {},
                firstPlayer: 'player1',
                secondPlayer: 'player2'
            };
            hideAllPhases();
            document.getElementById('start-phase').classList.remove('hidden');
            document.getElementById('start-error').textContent = '';
        }

        function hideAllPhases() {
            document.getElementById('start-phase').classList.add('hidden');
            document.getElementById('declaration-phase').classList.add('hidden');
            document.getElementById('game-phase').classList.add('hidden');
            document.getElementById('result-phase').classList.add('hidden');
            document.getElementById('final-result').classList.add('hidden');
            document.getElementById('score-board').classList.add('hidden');
            document.getElementById('difficult-image').classList.add('hidden');
        }

        function updateDeclarationPhaseUI() {
            const currentRound = gameState.currentRound;
            const remaining = gameState.totalRounds - currentRound + 1;
            document.getElementById('current-round').textContent = currentRound;
            document.getElementById('remaining-rounds').textContent = remaining;

            document.getElementById('player1-title').textContent = gameState.player1Name;
            document.getElementById('player2-title').textContent = gameState.player2Name;
            document.getElementById('player1-score').textContent = gameState.score1;
            document.getElementById('player2-score').textContent = gameState.score2;

            const firstPlayerName = gameState[gameState.firstPlayer + 'Name'];
            document.getElementById('first-player-indicator-decl').textContent = firstPlayerName + " goes first!";

            const choices = (gameState.difficulty === 'easy') ? CHOICES_EASY : CHOICES_DIFFICULT;
            renderDeclarationOptions('declaration1-buttons', 'declaration1', choices);
            renderDeclarationOptions('declaration2-buttons', 'declaration2', choices);

            updateScoreBoard();
            if (gameState.difficulty === 'difficult') {
                document.getElementById('difficult-image').classList.remove('hidden');
            }
        }

        function renderDeclarationOptions(containerId, name, choices) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            choices.forEach(choice => {
                const label = document.createElement('label');
                label.className = 'declaration-option';
                label.innerHTML = `
                    <input type="radio" name="${name}" value="${choice}" required>
                    <img src="images/${choice}.png" alt="${choice}">
                    <span class="checkmark">&#10004;</span>
                `;
                container.appendChild(label);
            });
        }

        function updateGamePhaseUI() {
            const currentRound = gameState.currentRound;
            const remaining = gameState.totalRounds - currentRound + 1;
            document.getElementById('current-round-game').textContent = currentRound;
            document.getElementById('remaining-rounds-game').textContent = remaining;

            document.getElementById('player1-title-game').textContent = gameState.player1Name;
            document.getElementById('player2-title-game').textContent = gameState.player2Name;
            document.getElementById('player1-score-game').textContent = gameState.score1;
            document.getElementById('player2-score-game').textContent = gameState.score2;

            const firstPlayerName = gameState[gameState.firstPlayer + 'Name'];
            document.getElementById('first-player-indicator-game').textContent = firstPlayerName + " goes first!";

            const choices = (gameState.difficulty === 'easy') ? CHOICES_EASY : CHOICES_DIFFICULT;
            renderPlayOptions('play1-buttons', 'play1', choices, gameState.declaration1);
            renderPlayOptions('play2-buttons', 'play2', choices, gameState.declaration2);

            updateScoreBoard();
            if (gameState.difficulty === 'difficult') {
                document.getElementById('difficult-image').classList.remove('hidden');
            }
        }

        function renderPlayOptions(containerId, action, choices, declaredChoice) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            choices.forEach(choice => {
                const form = document.createElement('form');
                form.innerHTML = `
                    <input type="hidden" name="choice" value="${choice}">
                    <button type="submit" class="move-button" aria-label="${choice}">
                        <img src="images/${choice}.png" alt="${choice}">
                    </button>
                `;
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    handlePlay(action, choice);
                });
                container.appendChild(form);
            });
        }

        function handlePlay(playerAction, choice) {
            if (playerAction === 'play1') {
                gameState.play1 = choice;
            } else {
                gameState.play2 = choice;
            }

            if (gameState.play1 && gameState.play2) {
                const rules = (gameState.difficulty === 'easy') ? RULES_EASY : RULES_DIFFICULT;
                const winner = getWinner(gameState.play1, gameState.play2, rules);
                gameState.winner = winner;
                updateScores(winner, gameState.currentRound);
                showResultPhase();
            }
        }

        function getWinner(choice1, choice2, rules) {
            if (choice1 === choice2) {
                return 'tie';
            } else if (rules[choice1] && rules[choice1].includes(choice2)) {
                return 'player1';
            } else {
                return 'player2';
            }
        }

        function updateScores(winner, currentRound) {
            let round_score_p1 = 0;
            let round_score_p2 = 0;

            if (winner === 'player1') {
                round_score_p1 += 2;
                round_score_p2 -= 1;
            } else if (winner === 'player2') {
                round_score_p2 += 2;
                round_score_p1 -= 1;
            }

            let declaration_adherence_p1 = false;
            let declaration_adherence_p2 = false;

            if (gameState.declaration1 === gameState.play1) {
                round_score_p1 += 1;
                declaration_adherence_p1 = true;
            }
            if (gameState.declaration2 === gameState.play2) {
                round_score_p2 += 1;
                declaration_adherence_p2 = true;
            }

            gameState.score1 += round_score_p1;
            gameState.score2 += round_score_p2;

            gameState.roundScores[currentRound] = {
                player1: round_score_p1,
                player2: round_score_p2
            };

            gameState.roundDeclarationAdherence[currentRound] = {
                player1: declaration_adherence_p1,
                player2: declaration_adherence_p2
            };

            gameState.roundWinners[currentRound] = winner;
        }

        function updateResultPhaseUI() {
            const currentRound = gameState.currentRound;
            const remaining = gameState.totalRounds - currentRound + 1;
            document.getElementById('current-round-result').textContent = currentRound;
            document.getElementById('remaining-rounds-result').textContent = remaining;

            document.getElementById('player1-title-result').textContent = gameState.player1Name;
            document.getElementById('player2-title-result').textContent = gameState.player2Name;
            document.getElementById('player1-score-result').textContent = gameState.score1;
            document.getElementById('player2-score-result').textContent = gameState.score2;

            const p1Play = gameState.play1;
            const p2Play = gameState.play2;
            const winner = gameState.winner;

            document.getElementById('chosen1-img').src = "images/" + p1Play + ".png";
            document.getElementById('chosen1-img').alt = p1Play;
            document.getElementById('chosen2-img').src = "images/" + p2Play + ".png";
            document.getElementById('chosen2-img').alt = p2Play;

            let resultText = '';
            if (winner === 'player1') {
                resultText = gameState.player1Name + " wins this round!";
            } else if (winner === 'player2') {
                resultText = gameState.player2Name + " wins this round!";
            } else {
                resultText = "It's a tie!";
            }
            document.getElementById('round-winner-text').textContent = resultText;

            updateScoreBoard();
            if (gameState.difficulty === 'difficult') {
                document.getElementById('difficult-image').classList.remove('hidden');
            }
        }

        function updateFinalResultUI() {
            document.getElementById('player1-final-name').textContent = gameState.player1Name;
            document.getElementById('player2-final-name').textContent = gameState.player2Name;
            document.getElementById('player1-final-score').textContent = gameState.score1;
            document.getElementById('player2-final-score').textContent = gameState.score2;

            let finalText = '';
            if (gameState.score1 > gameState.score2) {
                finalText = "The winner is: " + gameState.player1Name + "!";
            } else if (gameState.score1 < gameState.score2) {
                finalText = "The winner is: " + gameState.player2Name + "!";
            } else {
                finalText = "It's a tie!";
            }
            document.getElementById('final-winner-text').textContent = finalText;

            updateScoreBoard();
            if (gameState.difficulty === 'difficult') {
                document.getElementById('difficult-image').classList.remove('hidden');
            }
        }

        function updateScoreBoard() {
            const board = document.getElementById('score-board');
            board.classList.remove('hidden');

            const table = document.getElementById('score-table');
            table.innerHTML = '';

            let headerRow = document.createElement('tr');
            headerRow.appendChild(document.createElement('th'));
            for (let i = 1; i <= gameState.totalRounds; i++) {
                const th = document.createElement('th');
                th.textContent = i;
                headerRow.appendChild(th);
            }
            table.appendChild(headerRow);

            let p1Row = document.createElement('tr');
            let p1NameCell = document.createElement('td');
            p1NameCell.textContent = gameState.player1Name;
            p1Row.appendChild(p1NameCell);
            for (let i = 1; i <= gameState.totalRounds; i++) {
                const td = document.createElement('td');
                const roundScore = gameState.roundScores[i] || {};
                const p1Score = roundScore.player1 !== undefined ? roundScore.player1 : '';
                td.textContent = p1Score;
                const adherence = gameState.roundDeclarationAdherence[i] ? gameState.roundDeclarationAdherence[i].player1 : false;
                if (adherence) {
                    td.classList.add('adhered');
                }
                p1Row.appendChild(td);
            }
            table.appendChild(p1Row);

            let p2Row = document.createElement('tr');
            let p2NameCell = document.createElement('td');
            p2NameCell.textContent = gameState.player2Name;
            p2Row.appendChild(p2NameCell);
            for (let i = 1; i <= gameState.totalRounds; i++) {
                const td = document.createElement('td');
                const roundScore = gameState.roundScores[i] || {};
                const p2Score = roundScore.player2 !== undefined ? roundScore.player2 : '';
                td.textContent = p2Score;
                const adherence = gameState.roundDeclarationAdherence[i] ? gameState.roundDeclarationAdherence[i].player2 : false;
                if (adherence) {
                    td.classList.add('adhered');
                }
                p2Row.appendChild(td);
            }
            table.appendChild(p2Row);
        }
    </script>
</body>
</html>
